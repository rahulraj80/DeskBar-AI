; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download//55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions/7MB_app_ota_2MB_littlefs.csv
lib_deps = 
	lvgl/lvgl@^8.3.11
	bblanchon/ArduinoJson@^7.4.2
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags = 
	-DCONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-DBOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I src
	-I src/ui
	-I include
monitor_speed = 115200
upload_speed = 921600
build_type = release
extra_scripts = pre:tools/gzip_web_page.py
monitor_filters =
	esp32_exception_decoder
	default

; App installed by WaveShare_3.49_Launcher: no in-app OTA, LittleFS labelled
; "littlefs" right after a 5 MB app. Package with scripts/build_launcher_image.sh.
[env:deskbar-launcher]
extends = env:esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/launcher_app5MB_littlefs.csv
build_flags =
	${env:esp32-s3-devkitc1-n16r8.build_flags}
	-D LAUNCHER_BUILD
	; Radio and LAN streams here are MP3/AAC/WAV; leave the other codecs out.
	-D AUDIO_NO_FLAC
	-D AUDIO_NO_OPUS
	-D AUDIO_NO_VORBIS
