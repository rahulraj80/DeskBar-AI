# ==============================================================================
# TuneBar Secrets & Endpoints Override Configuration (secrets.ini)
# ==============================================================================
# To use:
# 1. Edit this file with your custom endpoints / keys.
# 2. Upload it to /secrets.ini on your TuneBar via the Web Remote file manager or CLI.
# 3. TuneBar will read this file on boot and redirect all cloud traffic to your own servers!

[cloud]
# Set to 1 to acknowledge community cloud terms or custom server usage
consent=1

[ai]
# Self-hosted AI Voice Assistant endpoint (must support HTTPS POST with WAV)
endpoint=https://autobots.my.to/ask.php

[telemetry]
# Custom telemetry logging endpoint (accepts JSON batch POST)
endpoint=https://autobots.my.to/myapi.php

# Custom telemetry database table name (default is TB_<device_hash>)
table=TB_YOUR_DEVICE_HASH

# Telemetry snapshot cadence in seconds (default: 300 = 5 minutes)
interval_sec=300

[weather]
# WeatherAPI.com API key for local forecast and AQI
api_key=1f00c88f3483483a9ba62101250612

[security]
# Device Master PIN (used for settings lock and salt for table hash derivation)
master_pin=1234
